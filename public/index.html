<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080d1d"><meta name="description" content="UC Esports Tournament — compete, earn XP and climb the leaderboard."><title>UC ESPORTS TOURNAMENT</title><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icons/icon-192.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"><style>
:root{color-scheme:dark;--bg:#080d1d;--panel:#101a32;--panel2:#152342;--line:#26385e;--txt:#eef4ff;--muted:#98a9c8;--blue:#3c8cff;--purple:#8958ff;--pink:#ef4bb5;--green:#36d7a0;--red:#ff647e}*{box-sizing:border-box}body{margin:0;background:radial-gradient(900px 450px at 90% -10%,#2d1764 0,transparent 65%),radial-gradient(700px 400px at -15% 15%,#10356b 0,transparent 65%),var(--bg);color:var(--txt);font:14px Inter,system-ui,sans-serif;min-height:100vh}button,input,select,textarea{font:inherit}button{cursor:pointer}.wrap{max-width:1180px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px solid var(--line);padding:12px 0 18px}.brand{display:flex;align-items:center;gap:10px;font-weight:900;letter-spacing:.06em}.brand img{width:44px;height:44px;border-radius:12px}.brand span{background:linear-gradient(90deg,#63a8ff,#b26bff,#ff69be);color:transparent;background-clip:text}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:11px;padding:11px 15px;background:linear-gradient(100deg,var(--blue),var(--purple),var(--pink));color:#fff;font-weight:800}.btn.alt{background:#172747;border:1px solid var(--line)}.btn.danger{background:#62243d}.btn:disabled{opacity:.45;cursor:not-allowed}.layout{display:grid;grid-template-columns:230px 1fr;gap:18px;margin-top:20px}.side,.panel,.card{background:linear-gradient(145deg,rgba(20,34,63,.96),rgba(12,21,41,.96));border:1px solid var(--line);border-radius:17px}.side{padding:12px;height:max-content;position:sticky;top:15px}.nav{display:grid;gap:7px}.nav button{text-align:left;color:var(--muted);background:transparent;border:0;border-radius:10px;padding:12px}.nav button.active,.nav button:hover{background:#1a2c50;color:#fff}.content{min-width:0}.panel{padding:18px;margin-bottom:16px}.hero{padding:24px;background:linear-gradient(110deg,#152b50,#32185b 80%);border:1px solid #57438b;border-radius:18px;margin-bottom:16px}.hero h1{font-size:clamp(26px,4vw,42px);margin:0 0 8px}.muted{color:var(--muted)}.stats,.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}.stat,.card{padding:14px}.stat{background:#0c1730;border:1px solid var(--line);border-radius:13px}.stat b{display:block;font-size:23px;margin-top:5px}.cards{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}.card h3{margin:0 0 8px}.pill{display:inline-block;border:1px solid var(--line);background:#142444;color:#c9d8f5;border-radius:99px;padding:4px 9px;font-size:11px;margin:2px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.field{display:grid;gap:6px;margin:10px 0;color:var(--muted)}input,textarea,select{width:100%;padding:11px;border-radius:10px;background:#09142b;border:1px solid var(--line);color:#fff}input[type=file]{padding:8px}.hide{display:none!important}.notice{padding:12px;border-radius:11px;background:#132747;border:1px solid var(--line);margin:10px 0}.good{color:var(--green)}.bad{color:var(--red)}.table{width:100%;border-collapse:collapse}.table td,.table th{text-align:left;border-bottom:1px solid var(--line);padding:10px}.table-wrap{overflow:auto}.avatar{width:54px;height:54px;border-radius:50%;object-fit:cover;background:#22375e}.auth{max-width:480px;margin:9vh auto}.auth .panel{text-align:center}.qr{background:white;padding:12px;border-radius:12px;display:inline-block;margin:10px 0}.small{font-size:12px}.stream{width:100%;aspect-ratio:16/9;border:0;border-radius:12px;background:#050a16}.foot{padding:20px;text-align:center;color:var(--muted);font-size:12px}@media(max-width:760px){.wrap{padding:12px}.layout{grid-template-columns:1fr}.side{position:static;padding:7px}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap}.brand span{font-size:13px}.top{align-items:flex-start}.actions .btn{padding:9px 11px}}
</style></head><body><div class="wrap"><header class="top"><div class="brand"><img src="/icons/icon-192.png" alt="UC"><span>UC ESPORTS TOURNAMENT</span></div><div class="actions"><button id="loginGoogle" class="btn">Continue with Google</button><button id="logout" class="btn alt hide">Sign out</button></div></header><section id="authView" class="auth"><div class="panel"><h1>ENTER THE ARENA</h1><p class="muted">Sign in to join free tournaments, earn XP and climb the leaderboard.</p><button id="google2" class="btn">Continue with Google</button><p id="authMsg" class="muted small"></p></div></section><div id="app" class="layout hide"><aside class="side"><div id="miniProfile" class="notice"></div><nav class="nav"><button data-page="home" class="active">⌂ Home</button><button data-page="tournaments">🏆 Tournaments</button><button data-page="wallet">◈ Wallet</button><button data-page="rewards">🎁 Daily rewards</button><button data-page="leaderboard">♛ Leaderboard</button><button data-page="profile">◉ Profile</button></nav></aside><main id="view" class="content"></main></div><div class="foot">UC ESPORTS TOURNAMENT · Play fair · 18+ only · Bonus credits are non-withdrawable.</div></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><script src="/firebase-config.js"></script><script src="/spark-api.js"></script><script>
if(!window.FIREBASE_CONFIG)throw new Error('Firebase config missing');firebase.initializeApp(FIREBASE_CONFIG);const auth=firebase.auth(),db=firebase.firestore(),spark=UCEFirebaseSpark.create(db,auth),$=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=n=>Number(n||0).toLocaleString('en-IN'),call=(n,d={})=>spark.call(n,d);let user=null,U={},W={},tours=[],tx=[],regs=[],notes=[],page='home';
function msg(s,good=false){const el=$('#message');if(el){el.textContent=s;el.className='notice '+(good?'good':'bad')}}
async function refresh(){const [u,w,t,x,r,n]=await Promise.all([db.doc('users/'+user.uid).get(),db.doc('wallets/'+user.uid).get(),db.collection('tournaments').orderBy('startAt','asc').limit(50).get(),db.collection('transactions').where('uid','==',user.uid).limit(50).get(),db.collection('registrations').where('uid','==',user.uid).get(),db.collection('notifications').where('uid','==',user.uid).get()]);U=u.data()||{};W=w.data()||{};tours=t.docs.map(d=>({id:d.id,...d.data()}));regs=r.docs.map(d=>d.data());notes=n.docs.map(d=>d.data()).sort((a,b)=>(b.at?.seconds||0)-(a.at?.seconds||0)).slice(0,5);tx=x.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.at?.seconds||0)-(a.at?.seconds||0));$('#miniProfile').innerHTML=`<div class="row"><img class="avatar" src="${esc(U.photoURL||'https://placehold.co/80x80/152342/ffffff?text=UC')}" alt=""></div><b>${esc(U.username||user.displayName||'Player')}</b><div class="muted small">Level ${U.level||1} · ${U.xp||0} XP</div><div class="pill">${esc(U.title||'Rookie')}</div>`;render()}
function render(){document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));const v=$('#view');if(page==='home')v.innerHTML=home();if(page==='tournaments')v.innerHTML=tournamentPage();if(page==='wallet')v.innerHTML=walletPage();if(page==='rewards')v.innerHTML=rewardsPage();if(page==='leaderboard')v.innerHTML=leaderboardPage();if(page==='profile')v.innerHTML=profilePage();}
function home(){const live=tours.filter(t=>t.status==='live'),up=tours.filter(t=>t.status==='upcoming');return `<div class="hero"><span class="pill">WELCOME BACK</span><h1>READY. AIM. DOMINATE.</h1><p>Compete in Free Fire, BGMI and Minecraft tournaments. All tournaments are free to enter. Earn XP and climb the ranks.</p><button class="btn" onclick="go('tournaments')">Explore tournaments</button></div><div class="stats"><div class="stat"><span class="muted">Registered teams</span><b>${U.joined||0}</b></div><div class="stat"><span class="muted">Daily streak</span><b>${U.dailyStreak||0} days</b></div><div class="stat"><span class="muted">Level / XP</span><b>${U.level||1} / ${U.xp||0}</b></div></div>${notes.length?`<div class="panel"><h2>Notifications</h2>${notes.map(n=>`<div class="notice"><b>${esc(n.title)}</b><div>${esc(n.body)}</div><small>${n.at?.toDate?n.at.toDate().toLocaleString('en-IN'):''}</small></div>`).join('')}</div>`:''}<div class="panel"><div class="row"><h2>Live matches</h2><button class="btn alt" onclick="go('tournaments')">All tournaments</button></div>${live.length?live.map(tourCard).join(''):'<p class="muted">No live matches right now.</p>'}</div><div class="panel"><h2>Upcoming tournaments</h2><div class="cards">${up.slice(0,6).map(tourCard).join('')||'<p class="muted">New tournaments will appear here.</p>'}</div></div>`}
function tourCard(t){const dt=t.startAt?.toDate?t.startAt.toDate().toLocaleString('en-IN'):'Schedule TBA';return `<article class="card"><div class="row"><span class="pill">${esc(t.game||'Game')} · ${esc(t.type||'Solo')}</span><span class="pill">${esc(t.status||'upcoming')}</span></div><h3>${esc(t.title)}</h3><p class="muted">${esc(t.map||'')} · ${dt}</p><div class="stats"><div class="stat"><small>Entry</small><b>FREE</b></div><div class="stat"><small>XP pool</small><b>${Number(t.prize||0).toLocaleString("en-IN")} XP</b></div><div class="stat"><small>Teams</small><b>${t.joined||0}/${t.max||0}</b></div><div class="stat"><small>Players</small><b>${t.playerCount||0}</b></div></div><p><b>Prize split:</b> ${esc(t.split||'Set by tournament admin')}</p><p>${esc(t.rules||'')}</p>${t.status==='live'&&t.streamUrl?`<a class="btn" href="${esc(t.streamUrl)}" target="_blank" rel="noopener">▶ SPECTATE MATCH</a>`:''}${t.status==='upcoming'&&!regs.some(r=>r.tid===t.id&&r.status==='registered')?`<button class="btn" onclick="join('${t.id}')">Join tournament</button>`:''}${regs.some(r=>r.tid===t.id&&r.status==='registered')?`<button class="btn alt" onclick="room('${t.id}')">View room details</button>`:''}<button class="btn alt" onclick="roster('${t.id}')">Joined players</button></article>`}
function tournamentPage(){return `<div class="panel"><h1>Tournaments</h1><p class="muted">Free entry · Solo uses 1 player tag, Duo 2 tags, Squad 4 tags. Earn XP by joining and completing matches.</p><div class="cards">${tours.map(tourCard).join('')||'<p class="muted">No tournaments published yet.</p>'}</div></div>`}
window.room=async id=>{try{const r=await call('getRoom',{tid:id});alert('Room ID: '+r.roomId+'\nPassword: '+r.roomPass)}catch(e){alert(e.message)}};window.roster=async id=>{try{const q=await db.collection('tournament_rosters').doc(id).collection('teams').get();const rows=q.docs.map(d=>{const x=d.data();return (x.members||[]).map((m,i)=>`${esc(x.username)} — ${esc(m.ign)} (${esc(m.gameId)})`).join('\n')}).join('\n');alert(rows||'No registered players yet.')}catch(e){alert(e.message)}};
window.join=async id=>{const t=tours.find(x=>x.id===id);if(!t)return;const n=(String(t.type||'').toLowerCase().includes('squad')?4:String(t.type||'').toLowerCase().includes('duo')?2:1),players=[];for(let i=0;i<n;i++){const ign=prompt(`Player ${i+1}/${n} — in-game name`);if(!ign)return;const gameId=prompt(`Player ${i+1}/${n} — game UID`);if(!gameId)return;players.push({ign,gameId})}if(!confirm('Confirm you are 18+ and accept tournament rules?'))return;try{await call('joinTournament',{tid:id,players,age18:true});await refresh();alert('Tournament joined successfully! +50 XP.')}catch(e){alert(e.message)}};
function walletPage(){return `<div class="panel"><h1>Wallet</h1><p class="muted">Your wallet layout is preserved for the future.</p><div class="notice"><b>Coming Soon</b><p>Deposits, withdrawals, UPI payments and cash prizes are disabled in the free Firebase Spark version.</p><p>All tournaments currently use free entry and XP rewards only. No money will be collected or credited.</p></div></div>`}
function rewardsPage(){const claimed=U.lastDailyClaimDate===new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Kolkata'}).format(new Date());return `<div class="panel"><h1>Daily rewards</h1><p class="muted">Claim once every 24 hours and earn XP. XP helps you level up and rank on the leaderboard.</p><div class="cards">${[2,4,6,8,3,7,3].map((v,i)=>`<div class="card"><span class="pill">Day ${i+1}</span><h2>${v*10} XP</h2></div>`).join('')}</div><p>Current streak: <b>${U.dailyStreak||0} days</b></p><button id="claimReward" class="btn" ${claimed?'disabled':''}>${claimed?'Claimed today':'Claim daily reward'}</button><div id="message"></div></div>`}
function leaderboardPage(){return `<div class="panel"><h1>Leaderboard</h1><p class="muted">Rankings update when tournament results are published.</p><div id="leaderboardRows">Loading…</div></div>`}
async function loadLeaderboard(){const q=await db.collection('leaderboards').orderBy('xp','desc').limit(50).get();$('#leaderboardRows').innerHTML=q.empty?'<p class="muted">No ranked players yet.</p>':`<div class="table-wrap"><table class="table"><tr><th>Rank</th><th>Player</th><th>Wins</th><th>Earnings</th></tr>${q.docs.map((d,i)=>`<tr><td>#${i+1}</td><td>${esc(d.data().username||'Player')}</td><td>${d.data().wins||0}</td><td>${money(d.data().earnings)}</td></tr>`).join('')}</table></div>`}
function profilePage(){return `<div class="panel"><h1>Player profile</h1><form id="profileForm"><label class="field">Display name<input name="username" maxlength="24" minlength="3" value="${esc(U.username||'')}" required></label><label class="field">Mobile number<input name="mobile" value="${esc(U.mobile||'')}" maxlength="18"></label><p class="muted small">Profile photo uses your Google account image. Uploads are disabled in the Spark free build.</p><label class="field">Free Fire UID<input name="ff" value="${esc(U.gameIds?.ff||'')}"></label><label class="field">BGMI UID<input name="bg" value="${esc(U.gameIds?.bg||'')}"></label><label class="field">Minecraft gamertag<input name="mc" value="${esc(U.gameIds?.mc||'')}"></label><button class="btn">Save profile</button></form><div class="notice">${esc(user.email||'')} · ${esc(U.title||'Rookie')} · Level ${U.level||1} · ${U.xp||0} XP</div><div id="message"></div></div>`}
document.addEventListener('click',e=>{const b=e.target.closest('[data-page]');if(b)go(b.dataset.page)});window.go=p=>{page=p;render();if(p==='leaderboard')loadLeaderboard()};
document.addEventListener('submit',async e=>{if(e.target.id==='profileForm'){e.preventDefault();const f=e.target,d=new FormData(f);try{let photoURL=U.photoURL||'';const file=d.get('photo');if(file&&file.size){if(file.size>2*1024*1024)throw Error('Profile image must be under 2 MB.');const ref=storage.ref(`avatars/${user.uid}/${Date.now()}_${file.name.replace(/[^\w.]/g,'_')}`);await ref.put(file);photoURL=await ref.getDownloadURL()}await db.doc('users/'+user.uid).update({username:d.get('username').trim(),mobile:d.get('mobile').trim(),photoURL,gameIds:{ff:d.get('ff').trim(),bg:d.get('bg').trim(),mc:d.get('mc').trim()}});await refresh();alert('Profile updated.')}catch(x){alert(x.message)}}
});
document.addEventListener('click',async e=>{if(e.target.id==='claimReward'){try{const r=await call('claimDailyReward');alert(`Claimed ${r.reward} XP! Streak: ${r.streak}`);await refresh()}catch(x){alert(x.message)}}});
document.addEventListener('input',async e=>{if(e.target.id==='depositAmount'){const snap=await db.doc('settings/public').get().catch(()=>null),cfg=snap?.data()||{},upi=cfg.upiId,amount=Number(e.target.value),box=$('#upiQr');if(!upi||!amount||amount<10){box.classList.add('hide');return}box.classList.remove('hide');box.innerHTML='';new QRCode(box,{text:`upi://pay?pa=${encodeURIComponent(upi)}&pn=${encodeURIComponent(cfg.upiMerchantName||'UC ESPORTS')}&am=${amount}&cu=INR`,width:180,height:180});$('#upiLabel').textContent='Pay '+money(amount)+' to '+upi+'. Upload the screenshot and enter UTR below.'}});
async function signIn(){try{await auth.signInWithPopup(new firebase.auth.GoogleAuthProvider())}catch(e){$('#authMsg').textContent=e.message}}$('#loginGoogle').onclick=$('#google2').onclick=signIn;$('#logout').onclick=()=>auth.signOut();auth.onAuthStateChanged(async u=>{user=u;$('#authView').classList.toggle('hide',!!u);$('#app').classList.toggle('hide',!u);$('#logout').classList.toggle('hide',!u);$('#loginGoogle').classList.toggle('hide',!!u);if(u){try{await call('ensurePlayerProfile');await refresh()}catch(e){$('#view').innerHTML='<div class="panel bad">'+esc(e.message)+'</div>'}}});
</script></body></html>
