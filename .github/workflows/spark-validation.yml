name: Firebase Spark validation

on:
  push:
    branches:
      - firebase-spark-free
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Java for Firestore emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install dependencies
        run: npm ci
      - name: Check project and JavaScript syntax
        run: npm run build
      - name: Compile Firestore rules in emulator
        run: npx --yes firebase-tools@latest emulators:exec --only firestore --project demo-uc-esports "echo Firestore emulator started and rules compiled"
