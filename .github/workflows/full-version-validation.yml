name: Full version validation
on:
  push:
    branches: [full-version-razorpay]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Validate project and JavaScript
        run: |
          npm ci
          npm run build
          node --check functions/index.js
      - name: Install Firebase CLI
        run: npm install --global firebase-tools
      - name: Compile Firestore and Storage rules in emulators
        run: firebase emulators:exec --project demo-uc-esports --only firestore,storage "echo Firebase rules emulator startup completed"
